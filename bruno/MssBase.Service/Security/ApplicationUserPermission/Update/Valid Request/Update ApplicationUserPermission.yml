info:
  name: Update ApplicationUserPermission
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BaseUrl}}/Security/ApplicationUserPermission/:ApplicationUserPermissionId"
  params:
    - name: ApplicationUserPermissionId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "active": true,
        "applicationId": 1,
        "applicationUserId": 1,
        "permissionId": 1,
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5