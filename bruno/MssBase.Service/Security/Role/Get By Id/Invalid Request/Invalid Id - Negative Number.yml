info:
  name: Invalid Id - Negative Number
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/Security/Role/:RoleId"
  params:
    - name: includeInactive
      value: "true"
      type: query
      disabled: true
    - name: includeRelated
      value: "true"
      type: query
      disabled: true
    - name: includeReadOnly
      value: "true"
      type: query
      disabled: true
    - name: deleteCache
      value: "true"
      type: query
      disabled: true
    - name: RoleId
      value: "-1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5