info:
  name: Get Role Audit Logs By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/Security/Role/:RoleId/AuditLogs"
  params:
    - name: deleteCache
      value: "true"
      type: query
      disabled: true
    - name: RoleId
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5