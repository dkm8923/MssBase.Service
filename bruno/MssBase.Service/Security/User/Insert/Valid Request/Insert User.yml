info:
  name: Insert User
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/Security/User"
  body:
    type: json
    data: |-
      {
        "email": "{{Email}}",
        "title": "Mr.",
        "firstName": "BrunoTestFirstName",
        "middleName": "BrunoTestMiddleName",
        "lastName": "BrunoTestLastName",
        "preferredName": "BrunoTest",
        "suffix": "Jr.",
        "dateOfBirth": "1989-06-15",
        "timeZone": "EST",
        "maritalStatus": null,
        "religion": null,
        "gender": null,
        "spokenLanguages": null,
        "phoneNumbers": null,
        "socialMediaProfiles": null,
        "alternateEmails": null,
        "genderPronouns": null,
        "importantDates": null,
        "commonNotes": [
        {
          "noteType": "General", 
          "subject": "Routine Maintenace", 
          "text": "Just a friendly reminder, this user had routine maintenance today! :)",
          "active": true
        }
        ,{
          "noteType": "Warning", 
          "subject": "Spicy Burritos in Break Room", 
          "text": "Do not eat these, gave me food poisoning.",
          "active": true
        }
        ,{
          "noteType": "Danger", 
          "subject": "Be Careful, this person is crazy", 
          "text": "They are not normal, something is going on...",
          "active": true
        }],
        "active": true,
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: Email
      value: bruno.user@example.test

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
