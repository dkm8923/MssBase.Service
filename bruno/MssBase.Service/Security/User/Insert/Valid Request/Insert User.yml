info:
  name: Insert User
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/Security/User"
  body:
    type: json
    data: |-
      {
        "email": "{{Email}}",
        "title": "Mr.",
        "firstName": "BrunoTestFirstName",
        "middleName": "BrunoTestMiddleName",
        "lastName": "BrunoTestLastName",
        "preferredName": "BrunoTest",
        "suffix": "Jr.",
        "dateOfBirth": "1989-06-15",
        "timeZone": "EST",
        "maritalStatus": null,
        "religion": null,
        "gender": null,
        "spokenLanguages": null,
        "phoneNumbers": null,
        "socialMediaProfiles": null,
        "alternateEmails": null,
        "genderPronouns": null,
        "importantDates": null,
        "commonNotes": [
        {
          "noteType": "test1", 
          "subject": "Test Note 1 Subject", 
          "text": "Hello World Test Note 1",
          "active": true
        }
        ,{
          "noteType": "test2", 
          "subject": "Test Note 2 Subject", 
          "text": "Hello World Test Note 2",
          "active": true
        }],
        "active": true,
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: Email
      value: bruno.user@example.test

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
