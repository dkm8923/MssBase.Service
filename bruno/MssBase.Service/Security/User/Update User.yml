info:
  name: Update User
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BaseUrl}}/Security/User/:UserId"
  params:
    - name: UserId
      value: ""
      type: path
  body:
    type: json
    data: |-
      {
        "email": "{{Email}}",
        "title": "{{Title}}",
        "firstName": "{{FirstName}}",
        "middleName": "{{MiddleName}}",
        "lastName": "{{LastName}}",
        "preferredName": "{{PreferredName}}",
        "suffix": "{{Suffix}}",
        "dateOfBirth": "{{DateOfBirth}}",
        "timeZone": "{{TimeZone}}",
        "active": {{Active}},
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: Active
      value: "true"
    - name: FirstName
      value: Test First Name Update
    - name: LastName
      value: Test Last Name Update
    - name: Email
      value: TestEmailUpdate@Test.com
    - name: DateOfBirth
      value: 07/01/1989
    - name: Title
      value: Test Title Update
    - name: MiddleName
      value: Test Middle Name
    - name: PreferredName
      value: Test Preferred Name
    - name: Suffix
      value: Jr.
    - name: TimeZone
      value: EST

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
