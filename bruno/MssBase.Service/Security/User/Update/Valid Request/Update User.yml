info:
  name: Update User
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BaseUrl}}/Security/User/:UserId"
  params:
    - name: UserId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "email": "bruno.user.update@example.test",
        "title": "Mr.",
        "firstName": "BrunoTestFirstNameUpdate",
        "middleName": "BrunoTestMiddleName",
        "lastName": "BrunoTestLastNameUpdate",
        "preferredName": "BrunoTestUpdate",
        "suffix": "Jr.",
        "dateOfBirth": "1989-06-15",
        "timeZone": "EST",
        "active": true,
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
