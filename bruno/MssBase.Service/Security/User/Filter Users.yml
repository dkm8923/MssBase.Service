info:
  name: Filter Users
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/Security/User/Filter"
  body:
    type: json
    data: |-
      {
        "deleteCache": true,
        "createdBy": null,
        "createdOnDate": null,
        "updatedBy": null,
        "updatedOnDate": null,
        "userIds": null,
        "email": null,
        "firstName": null,
        "lastName": null,
        "dateOfBirth": null,
        "applicationId": null,
        "includeInactive": false,
        "includeRelated": false,
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
