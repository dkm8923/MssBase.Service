info:
  name: Get User By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/Security/User/:UserId"
  params:
    - name: UserId
      value: ""
      type: path
    - name: includeInactive
      value: "true"
      type: query
      disabled: true
    - name: IncludeRelated
      value: "true"
      type: query
      disabled: true
    - name: IncludeReadOnly
      value: "true"
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
