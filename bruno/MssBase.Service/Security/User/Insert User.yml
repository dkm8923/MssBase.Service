info:
  name: Insert User
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/Security/User"
  body:
    type: json
    data: |-
      {
        "email": "{{Email}}",
        "title": "{{Title}}",
        "firstName": "{{FirstName}}",
        "middleName": "{{MiddleName}}",
        "lastName": "{{LastName}}",
        "preferredName": "{{PreferredName}}",
        "suffix": "{{Suffix}}",
        "dateOfBirth": "{{DateOfBirth}}",
        "timeZone": "{{TimeZone}}",
        "active": {{Active}},
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: Active
      value: "true"
    - name: FirstName
      value: TestFirstName
    - name: LastName
      value: TestLastName
    - name: Email
      value: test@test.com
    - name: DateOfBirth
      value: 06/15/1989
    - name: Title
      value: Mr.
    - name: MiddleName
      value: Test Middle Name
    - name: PreferredName
      value: Test Preferred Name
    - name: Suffix
      value: Jr.
    - name: TimeZone
      value: EST

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
