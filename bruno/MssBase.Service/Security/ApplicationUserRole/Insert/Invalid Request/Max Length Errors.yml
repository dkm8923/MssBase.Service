info:
  name: Max Length Errors
  type: http
  seq: 5

http:
  method: POST
  url: "{{BaseUrl}}/Security/ApplicationUserRole"
  body:
    type: json
    data: |-
      {
        "active": true,
        "applicationId": 1,
        "applicationUserId": 1,
        "roleId": 1,
        "currentUser": "{{CurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: CurrentUser
      value: CurrentUserValueThatExceedsTheMaximumAllowedLengthOfSixtyFourCharacters

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5