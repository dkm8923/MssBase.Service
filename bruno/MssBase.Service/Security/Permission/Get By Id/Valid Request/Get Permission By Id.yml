info:
  name: Get Permission By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/Security/Permission/:PermissionId"
  params:
    - name: includeInactive
      value: "true"
      type: query
      disabled: true
    - name: includeReadOnly
      value: "true"
      type: query
      disabled: true
    - name: deleteCache
      value: "true"
      type: query
      disabled: true
    - name: PermissionId
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5