info:
  name: Insert Permission
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/Security/Permission"
  body:
    type: json
    data: |-
      {
        "active": {{Active}},
        "name": "{{Name}}",
        "description": "{{Description}}",
        "applicationId": {{ApplicationId}},
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: Active
      value: "true"
    - name: Name
      value: TestPermissionName
    - name: Description
      value: TestPermissionDescription
    - name: ApplicationId
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5