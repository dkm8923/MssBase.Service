info:
  name: Update Permission
  type: http
  seq: 1

http:
  method: PUT
  url: "{{BaseUrl}}/Security/Permission/:PermissionId"
  params:
    - name: PermissionId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "active": {{Active}},
        "name": "{{Name}}",
        "description": "{{Description}}",
        "applicationId": {{ApplicationId}},
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: Active
      value: "true"
    - name: Name
      value: Test Permission Name Update
    - name: Description
      value: Test Description Update
    - name: ApplicationId
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5