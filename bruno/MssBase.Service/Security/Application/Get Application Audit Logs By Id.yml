info:
  name: Get Application Audit Logs By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/Security/Application/:applicationId/AuditLogs?DeleteCache=true"
  params:
    - name: DeleteCache
      value: "true"
      type: query
    - name: applicationId
      value: ""
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
