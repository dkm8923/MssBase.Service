info:
  name: Get Application By Id
  type: http
  seq: 1

http:
  method: GET
  url: "{{BaseUrl}}/Security/Application/:ApplicationId"
  params:
    - name: includeInactive
      value: "true"
      type: query
      disabled: true
    - name: IncludeRelated
      value: "true"
      type: query
      disabled: true
    - name: IncludeReadOnly
      value: "true"
      type: query
      disabled: true
    - name: DeleteCache
      value: "true"
      type: query
      disabled: true
    - name: ApplicationId
      value: "1"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
