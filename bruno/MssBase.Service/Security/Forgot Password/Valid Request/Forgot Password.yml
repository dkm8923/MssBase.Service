info:
  name: Forgot Password
  type: http
  seq: 1

http:
  method: POST
  url: "{{BaseUrl}}/Security/Authentication/ForgotPassword"
  body:
    type: json
    data: |-
      {
        "email": "{{TestUserEmail}}",
        "currentUser": "{{DefaultCurrentUser}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5