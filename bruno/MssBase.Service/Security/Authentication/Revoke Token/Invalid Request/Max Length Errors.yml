info:
  name: Max Length Errors
  type: http
  seq: 3

http:
  method: POST
  url: "{{BaseUrl}}/Security/Authentication/RevokeToken"
  body:
    type: json
    data: |-
      {
        "email": "{{TestUserEmail}}",
        "currentUser": "{{CurrentUser}}"
      }
  auth: inherit

runtime:
  variables:
    - name: CurrentUser
      value: CurrentUserValueThatExceedsTheMaximumAllowedLengthOfSixtyFourCharacters

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5